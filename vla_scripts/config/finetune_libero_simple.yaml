# Finetune LatentWorldVLA on LIBERO, latent + perceptual

# Base model & LAM
model_cfg:
  model_id: "/mnt/project_rlinf/jlchen/weights/Qwen3-VL-2B-Instruct"
  lam_ckpt_path: "/mnt/project_rlinf/jlchen/code/UniVLA/latent_action_model/logs/dino_base_ae_bigwin/version_0/checkpoints/epoch=21.ckpt"
  lam_yaml_path: "/mnt/project_rlinf/jlchen/code/UniVLA/latent_action_model/logs/dino_base_ae_bigwin/version_0/dino_base_ae.yaml"
  perceptual_weight: 0.1
  # 细粒度冻结策略（替代原有的 freeze_vlm）
  freeze_vision_backbone: true      # 冻结视觉骨干
  freeze_llm_backbone: true         # 冻结语言模型骨干
  freeze_last_llm_layer: true      # 保持 LM head 可训练
  freeze_embedding: true           # 保持嵌入层可训练
  unfreeze_vision_merger: true     # 不解冻视觉 merger
  unfreeze_llm_last_n_layers: 4 # 不解冻最后 N 层（设为数字如 4 可解冻最后4层）
  unfreeze_lam_decoder: true
  latent_action_placeholder_token: "<ACT_PH>"
  future_prediction: True
  enable_wrist_view: true
# Dataset & preprocessing
data_root_dir: "/mnt/project_rlinf/jlchen/datasets"
data_mix: "libero_object_no_noops"
image_resolution: 256
shuffle_buffer_size: 20000
image_aug: True
use_history_frame: False


debug_repeat_batch: false
use_simple_model: true
window_size: 10

# Optimization
batch_size: 64
max_steps: 100000
save_steps: 5000
eval_steps: 1000
eval_batches: 20
learning_rate: 1.0e-4
warmup_steps: 1000
vlm_learning_rate: 1.0e-5
vlm_warmup_steps: 1000
grad_accumulation_steps: 1
gradient_clip: 1.0
weight_decay: 1.0e-8
# vlm_loss_weight: 1.0
seed: 42

# Logging / run id
run_id_note: "finetune_libero_object_simple_no_hist_wrist"
wandb_project: "finetune-LIBERO"
wandb_entity: null
