# ========================================
# 示例配置：冻结非动作 token 的 embedding
# ========================================
# 本配置展示如何在预测索引的训练方式下，仅更新动作 token 的 embedding，
# 而冻结其他所有 token 的 embedding

# Hugging Face 模型（本地路径或 HF Hub ID）
model_id: "/mnt/project_rlinf/jlchen/weights/Qwen3-VL-2B-Instruct"

# LAM 模型路径
lam_ckpt_path: "/mnt/project_rlinf/jlchen/code/UniVLA/latent_action_model/logs/dino_base_2q_16_bigwin/version_1/checkpoints/epoch=9.ckpt"
lam_yaml_path: "/mnt/project_rlinf/jlchen/code/UniVLA/latent_action_model/logs/dino_base_2q_16_bigwin/version_1/dino_base.yaml"
# lam_ckpt_path: "/mnt/project_rlinf/jlchen/code/UniVLA/latent_action_model/logs/dino_base_4q_32_bigwin/version_3/checkpoints/epoch=14.ckpt"
# lam_yaml_path: "/mnt/project_rlinf/jlchen/code/UniVLA/latent_action_model/logs/dino_base_4q_32_bigwin/version_3/dino_base.yaml"

# 数据与预处理
data_mix: libero_90
training_phase: lam_2f
use_history_frame: false
image_aug: true

# 训练超参
per_device_batch_size: 48
gradient_accumulation_steps: 2
learning_rate: 1e-5
warmup_steps: 0

# =========================
# Embedding 冻结策略
# =========================
# 注意：以下三个参数的使用场景不同：

# 1. freeze_embedding: false
#    - 必须设置为 false，否则整个 embedding 层都会被冻结
#    - 如果为 true，则所有 token 的 embedding 都无法更新
freeze_embedding: false

# 2. new_token_lr_scale: 1.0 (可选)
#    - 对动作 token 的学习率进行额外放大（如果需要）
#    - 设置为 1.0 表示使用正常学习率
#    - 设置为 > 1.0 (如 2.0) 可以加速动作 token 的学习
new_token_lr_scale: 10.0

# =========================
# 其他冻结策略（根据需求调整）
# =========================
freeze_vision_backbone: true
freeze_llm_backbone: true
unfreeze_llm_last_n_layers: 4
freeze_last_llm_layer: false
unfreeze_vision_merger: true

# =========================
# 监督模式
# =========================
supervise_quantized: false

# LAM 相关
enable_lam_kl_loss: false
enable_lam_decoder_perceptual: false

# LoRA（如果需要）
enable_lora: false

# 运行与日志
run_id: latent_vla_4q32_unfreeze_emb_llm4_merger_libero_90_wo_hist
debug_repeat_batch: false

