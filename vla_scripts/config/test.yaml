# 数据与预处理
data_mix: libero_object_no_noops


# 训练超参
training_phase: lam_2f
per_device_batch_size: 8
gradient_accumulation_steps: 1
learning_rate: 1e-5
warmup_steps: 0
use_history_frame: true
image_aug: false
latent_loss_type: "mse"
enable_lam_decoder_perceptual: true
lam_decoder_perceptual_weight: 1.0
lam_encoder_distill_weight: 1.0
act_query_lr_scale: 10.0
vlm_to_lam_lr_scale: 10.0

debug_repeat_batch: 8
# 运行与日志
run_id: test

enable_lora: false
freeze_last_llm_layer: true
freeze_vision_backbone: true
freeze_llm_backbone: true
unfreeze_llm_last_n_layers: 4
freeze_embedding: true
unfreeze_lam_decoder: true
lam_decoder_target: gt
unfreeze_vision_merger: true  





