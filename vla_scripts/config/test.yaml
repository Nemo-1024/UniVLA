# lam_ckpt_path: str="/mnt/mnt/public/jlchen/code/UniVLA/latent_action_model/logs/dino_base_4q_32_crossattn_mask_2f_norep_bn/version_1/checkpoints/epoch=19.ckpt"
# lam_yaml_path: str="/mnt/mnt/public/jlchen/code/UniVLA/latent_action_model/logs/dino_base_4q_32_crossattn_mask_2f_norep_bn/version_1/dino_base_2f.yaml"
