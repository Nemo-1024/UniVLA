# VJEPA_LAM 模型配置 - 适配 Lightning CLI
#
# 物理接地功能说明：
# 1. 设置 enable_state_delta_prediction: true 启用物理接地状态差解码器
# 2. 确保数据混合包含机械臂数据集（如 libero, bridge 等）和人类视频数据集（如 ego4d）
# 3. 模型会自动识别机械臂数据（状态非零）并计算物理接地辅助损失
# 4. 人类数据的状态在 transforms.py 中已被填充为零，不参与辅助损失计算


  
# 模型参数
model:
  # VJEPA_LAM 模型架构参数
  # vision_model_id: "/mnt/mnt/public/jlchen/weights/dinov3-vitl16-pretrain-lvd1689m"    #必须修改resolution，dino是224，cosmos和vjepa是256
  # vision_model_id: "/mnt/mnt/public/jlchen/weights/vjepa2-vitl-fpc64-256"
  vision_model_id: "/mnt/mnt/public/jlchen/weights/Cosmos-0.1-Tokenizer-CI16x16"
  dim: 512                    # 特征维度 (V-JEPA2 ViT Large 输出维度)
  enc_layers: 9                # LAM 编码器层数 16head
  codebook_size: 16           # 码本大小
  code_dim: 64                # 码本维度
  dec_layers: 6                # 解码器层数
  dropout: 0.0                 # Dropout 率

  
  # 学习率线性预热（按 step）
  warmup_steps: 0           # 预热步数；0 表示关闭预热
  
  # 物理接地状态差解码器参数       
  #由于数据已经缩放到 [-1, 1]，状态差（delta_s）向量的 模长范围在 [0, √3] ≈ [0, 1.73]。
  enable_state_delta_prediction: true     # 是否启用物理接地功能
  lambda_aux: 1.0                         # (↑↑) 进一步增加：让物理接地与视觉重构有更平等的对话地位。
  lambda_dir: 1.0                         # λ_dir 的选择主要取决于你想让「方向一致性」在总损失中的权重，初始值可设为 λ_dir = 1.0
  lambda_mag_reg: 0.5                    # λ_mag_reg 一般设为 0.5 ~ 1.0
  motion_threshold_beta: 0.1             # 如果你想忽略接近 0 的运动，可以设 β = 0.05 ~ 0.1。如果你希望只强调中等以上幅度，可以设 β = 0.3 ~ 0.5。
  motion_scale_alpha: 15.0               # α 控制 Sigmoid 的陡峭程度，>50则几乎变成阶跃函数，完全忽略小幅度的动作

  lambda_diversity: 0.0

  project: lam
  task_name: lam_test
  wandb_offline: true
  
  # 训练参数
  optimizer: 
    class_path: torch.optim.AdamW
    init_args:
      lr: 1e-3
      weight_decay: 0.0
  
  # 索引保存参数
  make_data_pair: false        # 是否生成数据对
  output_dir: output_pairs     # 输出目录

# 数据参数
data:
  data_root: /mnt/mnt/public/jlchen/datasets
  data_mix: bridge_dataset   # Manip. + Navi. + Human
  batch_size: 64
  resolution: 256            #dino是224
  num_frames: 16               # 视频帧数
  episodic: false
  shuffle_buffer_size: 102400   # 根据内存大小调整
  image_aug: true

# 训练器参数
trainer:
  max_epochs: 20
  accelerator: gpu
  devices: auto
  # strategy: ddp_find_unused_parameters_true
  strategy: ddp_find_unused_parameters_true
  precision: bf16-mixed
  log_every_n_steps: 1000
  gradient_clip_val: 1
  # enable_progress_bar: false  # 禁用重复的进度条
  val_check_interval: 1.0
  num_sanity_val_steps: 0
  limit_val_batches: 0

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        # dirpath: ./logs/vjepa_lam
        verbose: true
        # save_last: true
        save_top_k: -1
        # save_on_train_epoch_end: true    # 每个epoch结束时也保存
        every_n_epochs: 10
        # every_n_train_steps: 10000
        filename: "{epoch}"
        
    - class_path: latent_action_model.core.lam_lightinng.CodebookMaintenanceCallback
      init_args:
        interval_steps: 1000

    - class_path: latent_action_model.core.lam_lightinng.SaveConfigToCheckpointCallback

  logger:
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        save_dir: latent_action_model/logs
        name: lam_test    

    # - class_path: lightning.pytorch.loggers.WandbLogger
    #   init_args:
    #     project: UniVLA-latent_action_model
    #     name: lam
    #     offline: false

       

        
