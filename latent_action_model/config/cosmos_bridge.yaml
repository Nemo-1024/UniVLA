# VJEPA_LAM 模型配置 - 适配 Lightning CLI
#
# 物理接地功能说明：
# 1. 设置 enable_state_delta_prediction: true 启用物理接地状态差解码器
# 2. 确保数据混合包含机械臂数据集（如 libero, bridge 等）和人类视频数据集（如 ego4d）
# 3. 模型会自动识别机械臂数据（状态非零）并计算物理接地辅助损失
# 4. 人类数据的状态在 transforms.py 中已被填充为零，不参与辅助损失计算


  
# 模型参数
model:
  # VJEPA_LAM 模型架构参数
  # vision_model_id: "/mnt/project_rlinf/jlchen/weights/dinov3-vitl16-pretrain-lvd1689m"    #必须修改resolution，dino是224，vjepa是256
  # vision_model_id: "/mnt/project_rlinf/jlchen/weights/vjepa2-vitl-fpc64-256"
  vision_model_id: "/mnt/project_rlinf/jlchen/weights/Cosmos-0.1-Tokenizer-CI16x16"
  dim: 1024                    # 特征维度 (V-JEPA2 ViT Large 输出维度)
  encoder: LAMEncoder
  decoder: LAMDecoder_v2
  enc_layers: 12                # LAM 编码器层数 16head
  codebook_size: 32           # 码本大小
  code_dim: 64                # 码本维度
  dec_layers: 12                # 解码器层数
  dropout: 0.1                 # Dropout 率

  # 学习率线性预热（按 step）
  warmup_steps: 2000           # 预热步数；0 表示关闭预热
  
  lambda_aux: 1.0                         # (↑↑) 进一步增加：让物理接地与视觉重构有更平等的对话地位。


  lambda_diversity: 0.1

  project: lam
  task_name: cosmos_bridge
  wandb_offline: true
  
  # 训练参数
  optimizer: 
    class_path: torch.optim.AdamW
    init_args:
      lr: 1e-4
      weight_decay: 1e-2
  
  # 索引保存参数
  make_data_pair: false        # 是否生成数据对
  output_dir: output_pairs     # 输出目录

# 数据参数
data:
  data_root: /mnt/project_rlinf/jlchen/datasets
  data_mix: lam_plus    # Manip. + Navi. + Human
  batch_size: 32
  resolution: 256            #dino是224
  num_frames: 16             
  episodic: false
  shuffle_buffer_size: 102400   # 根据内存大小调整
  image_aug: true

# 训练器参数
trainer:
  max_epochs: 20
  accelerator: gpu
  devices: auto
  # strategy: ddp_find_unused_parameters_true
  strategy: ddp_find_unused_parameters_false
  precision: bf16-mixed
  log_every_n_steps: 1000
  gradient_clip_val: 1
  # enable_progress_bar: false  # 禁用重复的进度条
  val_check_interval: 2000
  num_sanity_val_steps: 0
  limit_val_batches: 100

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        # dirpath: ./logs/vjepa_lam
        verbose: true
        # save_last: true
        save_top_k: -1
        # save_on_train_epoch_end: true    # 每个epoch结束时也保存
        every_n_epochs: 1
        # every_n_train_steps: 10000
        filename: "{epoch}"
        
    - class_path: latent_action_model.core.lam_lightinng.CodebookMaintenanceCallback
      init_args:
        interval_steps: 1000

    - class_path: latent_action_model.core.lam_lightinng.SaveConfigToCheckpointCallback

  logger:
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        save_dir: latent_action_model/logs
        name: cosmos_bridge    

    # - class_path: lightning.pytorch.loggers.WandbLogger
    #   init_args:
    #     project: UniVLA-latent_action_model
    #     name: lam
    #     offline: false

       

        
