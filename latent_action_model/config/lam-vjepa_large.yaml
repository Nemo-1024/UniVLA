# VJEPA_LAM 模型配置 - 适配 Lightning CLI
#
# 物理接地功能说明：
# 1. 设置 enable_state_delta_prediction: true 启用物理接地状态差解码器
# 2. 确保数据混合包含机械臂数据集（如 libero, bridge 等）和人类视频数据集（如 ego4d）
# 3. 模型会自动识别机械臂数据（状态非零）并计算物理接地辅助损失
# 4. 人类数据的状态在 transforms.py 中已被填充为零，不参与辅助损失计算


  
# 模型参数
model:
  # VJEPA_LAM 模型架构参数
  dim: 1024                    # 特征维度 (V-JEPA2 ViT Large 输出维度)
  enc_layers: 9                # LAM 编码器层数
  codebook_size: 16            # 码本大小
  code_dim: 256                # 码本维度
  dec_layers: 9                # 解码器层数
  dec_self_heads: 8            # 解码器自注意力头数
  dec_cross_heads: 8           # 解码器交叉注意力头数
  dropout: 0.1                 # Dropout 率
  num_queries: 4               # 查询向量数量
  
  # 物理接地状态差解码器参数
  enable_state_delta_prediction: true  # 是否启用物理接地功能
  lambda_aux: 3.0                        # (↑↑) 进一步增加：让物理接地与视觉重构有更平等的对话地位。
  lambda_dir: 1.0                        # (保持)
  lambda_mag_reg: 0.1                 # (↓↓) 极度降低：几乎只把它当作一个微弱的正则项，防止幅度跑得太偏。
  motion_threshold_beta: 0.01            # (保持)
  motion_scale_alpha: 100.0              # (保持)

  project: UniVLA-latent_action_model
  task_name: lam_large
  wandb_offline: false
  
  # 训练参数
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 1e-4
      weight_decay: 1e-2
  
  # 索引保存参数
  make_data_pair: false        # 是否生成数据对
  output_dir: output_pairs     # 输出目录

# 数据参数
data:
  data_root: /mnt/public_zgc/home/jlchen/datasets
  data_mix: lam    # Manip. + Navi. + Human
  batch_size: 160
  resolution: 256
  num_frames: 16               # 视频帧数
  episodic: false
  shuffle_buffer_size: 10240   # 根据内存大小调整
  image_aug: true

# 训练器参数
trainer:
  max_epochs: 50
  accelerator: gpu
  num_nodes: 1
  devices: auto
  # strategy: ddp_find_unused_parameters_true
  strategy: ddp_find_unused_parameters_false
  precision: 16-mixed
  log_every_n_steps: 1000
  gradient_clip_val: 1
  # enable_progress_bar: false  # 禁用重复的进度条
  # val_check_interval: 100
  num_sanity_val_steps: 0
  limit_val_batches: 0

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        # dirpath: ./logs/vjepa_lam
        verbose: true
        # save_last: true
        save_top_k: -1
        # save_on_train_epoch_end: true    # 每个epoch结束时也保存
        every_n_epochs: 1
        filename: "{epoch}_{step}"

  logger:
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        save_dir: ./logs
        name: test

    # - class_path: lightning.pytorch.loggers.WandbLogger
