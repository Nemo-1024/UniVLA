# VJEPA_LAM 模型配置 - 适配 Lightning CLI
#
# 物理接地功能说明：
# 1. 设置 enable_state_delta_prediction: true 启用物理接地状态差解码器
# 2. 确保数据混合包含机械臂数据集（如 libero, bridge 等）和人类视频数据集（如 ego4d）
# 3. 模型会自动识别机械臂数据（状态非零）并计算物理接地辅助损失
# 4. 人类数据的状态在 transforms.py 中已被填充为零，不参与辅助损失计算


  
# 模型参数
model:
  # VJEPA_LAM 模型架构参数
  # vision_model_id: "/mnt/mnt/public/jlchen/weights/dinov3-vitl16-pretrain-lvd1689m" 
  vision_model_id: "/mnt/mnt/public/jlchen/weights/dinov3-vitb16-pretrain-lvd1689m"
  # vision_model_id: "/mnt/mnt/public/jlchen/weights/vjepa2-vitl-fpc64-256"
  # vision_model_id: "/mnt/mnt/public/jlchen/weights/Cosmos-0.1-Tokenizer-CI16x16"
  dim: 768                    # 特征维度 (V-JEPA2 ViT Large 输出维度)
  enc_layers: 12               # LAM 编码器层数 16head
  ffn_expansion_factor: 3

  codebook_size: 32        # 码本大小
  code_dim: 256                # 码本维度
  ar_prediction: false
  num_queries: 4
  num_frames: 2
  dec_layers: 12                # 解码器层数
  dropout: 0.0                 # Dropout 率              
  warmup_steps: 0           # 预热步数；0 表示关闭预热
  enc_add_state: false
  enc_modal_mask: true
  lambda_aux: 0.3                        # (↑↑) 进一步增加：让物理接地与视觉重构有更平等的对话地位。
  loss_type: "l1"

  latent_layer_to_use: -2
  multi_input: false
  norm_latents: true                 #syncbatchnorm归一化latents
  norm_latents_type: "ln"
  lambda_diversity: 0.01            #0.03与重建损失同一数量级
  vq_type: "vq"
  vq_kwargs:
    beta: 0.75
    use_cosine_sim: false
    layer_norm: false
    orthogonal_loss_weight: 0.03
    lambda_sample_entropy: 1.0
    lambda_codebook_entropy: 1.0
    max_code_replaced_per_step: 2


  project: lam
  task_name: dino_base_4q_32_l1_ln_div_001_10_vq_noln_beta_075_orth_003_256_norep


  wandb_offline: true
  
  # 训练参数
  optimizer: 
    class_path: torch.optim.AdamW
    init_args:
      lr: 1e-4
      weight_decay: 1e-4
  
  # 索引保存参数
  make_data_pair: false        # 是否生成数据对
  output_dir: output_pairs     # 输出目录

# 数据参数
data:
  data_root: /mnt/mnt/public/jlchen/datasets
  data_mix: bridge_dataset   # Manip. + Navi. + Human
  batch_size: 128
  resolution: 256            #dino是256
  episodic: false
  shuffle_buffer_size: 10240   # 根据内存大小调整
  image_aug: true
  training_phase: lam_2f
  debug_repeat_batch: false

# 训练器参数
trainer:
  max_epochs: 40
  accelerator: gpu
  devices: auto
  # strategy: ddp_find_unused_parameters_true
  strategy: ddp_find_unused_parameters_false
  accumulate_grad_batches: 1    
  precision: bf16-mixed            #bf16-mixed 32-true 
  log_every_n_steps: 1000
  gradient_clip_val: 1.0
  # enable_progress_bar: false  # 禁用重复的进度条
  val_check_interval: 999
  num_sanity_val_steps: 0
  limit_val_batches: 100

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        # dirpath: ./logs/vjepa_lam
        verbose: true
        save_last: true
        save_top_k: -1
        # save_on_train_epoch_end: true    # 每个epoch结束时也保存
        every_n_epochs: 5
        # every_n_train_steps: 10000
        filename: "{epoch}"
        
    - class_path: latent_action_model.core.lam_lightinng.CodebookMaintenanceCallback
      init_args:
        interval_steps: 100000000

    - class_path: latent_action_model.core.lam_lightinng.SaveConfigToCheckpointCallback

  logger:
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        save_dir: latent_action_model/logs
        name:  dino_base_4q_32_l1_ln_div_001_10_vq_noln_beta_075_orth_003_256_norep






    # - class_path: lightning.pytorch.loggers.WandbLogger
    #   init_args:
    #     project: UniVLA-latent_action_model
    #     name: lam
    #     offline: false

       

        
