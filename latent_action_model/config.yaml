# lightning.pytorch==2.4.0
seed_everything: 42
trainer:
  accelerator: gpu
  strategy: ddp_find_unused_parameters_false
  devices: auto
  num_nodes: 1
  precision: 16-mixed
  logger:
  - class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: test
      save_dir: .
      version: null
      offline: false
      dir: null
      id: null
      anonymous: null
      project: lam
      log_model: false
      experiment: null
      prefix: ''
      checkpoint_name: null
      entity: null
      notes: null
      tags: null
      config: null
      config_exclude_keys: null
      config_include_keys: null
      allow_val_change: null
      group: null
      job_type: null
      mode: null
      force: null
      reinit: null
      resume: null
      resume_from: null
      fork_from: null
      save_code: null
      tensorboard: null
      sync_tensorboard: null
      monitor_gym: null
      settings: null
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: null
      filename: '{epoch}_{step}'
      monitor: null
      verbose: false
      save_last: null
      save_top_k: -1
      save_weights_only: false
      mode: min
      auto_insert_metric_name: true
      every_n_train_steps: 10
      train_time_interval: null
      every_n_epochs: null
      save_on_train_epoch_end: null
      enable_version_counter: true
  fast_dev_run: false
  max_epochs: 20
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: 0
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 10
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: 1
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: null
model:
  dim: 1024
  enc_layers: 6
  codebook_size: 16
  code_dim: 256
  dec_layers: 6
  dec_self_heads: 4
  dec_cross_heads: 4
  dropout: 0.1
  num_queries: 4
  enable_state_delta_prediction: true
  lambda_aux: 3.0
  lambda_dir: 1.0
  lambda_mag_reg: 0.1
  motion_threshold_beta: 0.01
  motion_scale_alpha: 100.0
  task_name: vjepa_lam
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 0.0001
      betas:
      - 0.9
      - 0.999
      eps: 1.0e-08
      weight_decay: 0.01
      amsgrad: false
      maximize: false
      foreach: null
      capturable: false
      differentiable: false
      fused: null
  weight_decay: 0.01
  make_data_pair: false
  output_dir: output_pairs
data:
  data_root: /mnt/public_zgc/home/jlchen/datasets
  data_mix: droid_100
  batch_size: 256
  resolution: 256
  num_frames: 16
  episodic: false
  shuffle_buffer_size: 10240
  image_aug: true
  num_workers: 64
  train_shuffle: true
  val_shuffle: false
  val_batch_size: null
  worker_init_fn: null
  collate_fn: null
  train_sampler: null
  test_sampler: null
  val_sampler: null
optimizer: null
lr_scheduler: null
ckpt_path: null
